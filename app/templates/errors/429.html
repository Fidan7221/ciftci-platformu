{% extends "base.html" %}
{% block title %}Çok Fazla İstek{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <i class="bi bi-speedometer display-1 text-warning"></i>
  <h1 class="h2 fw-bold mt-3">429 · Çok fazla deneme</h1>
  <p class="text-muted">Güvenliğiniz için kısa süreli bir sınır uygulandı.
    Lütfen yaklaşık {{ retry_after }} saniye sonra tekrar deneyin.</p>
  <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-farm">Geri dön</a>
</div>
{% endblock %}
